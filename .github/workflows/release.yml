      - name: 压缩便携包
        shell: bash
        run: |
          SEVENZ_LOW_MEM_ARGS=(-t7z -mx=5 -md=64m -mmt=on)
          echo "压缩前磁盘空间:"
          df -h .

          # PyInstaller 构建完成后，build/ 中的中间产物和 staged model assets
          # 已经复制进 dist 下的角色目录，压缩前清掉它们以降低 runner 磁盘峰值。
          rm -rf build
          rm -rf "$HOME/.cache/pip" "$HOME/.cache/torch" "$HOME/.cache/music_ai_models" "$HOME/.music-to-midi"
          echo "清理构建缓存后磁盘空间:"
          df -h .

          if [ "${{ matrix.platform }}" = "Windows" ]; then
            WINDOWS_SHARED_NAME="MusicToMidi-${{ matrix.platform }}-${{ matrix.variant }}"
            WINDOWS_APP_NAME="${WINDOWS_SHARED_NAME}-App"
            WINDOWS_BACKEND_NAME="${WINDOWS_SHARED_NAME}-WebBackend"
            WINDOWS_FRONTEND_NAME="MusicToMidi-${{ matrix.platform }}-WebFrontend"
            WINDOWS_ROLE_NAMES=(
              "${WINDOWS_APP_NAME}"
              "${WINDOWS_BACKEND_NAME}"
              "${WINDOWS_FRONTEND_NAME}"
            )
            for WINDOWS_ROLE_NAME in "${WINDOWS_ROLE_NAMES[@]}"; do
              test -d "dist/${WINDOWS_ROLE_NAME}" || {
                echo "::error::Windows portable role directory is missing: dist/${WINDOWS_ROLE_NAME}"
                exit 1
              }
              DIR_SIZE=$(du -sb "dist/${WINDOWS_ROLE_NAME}" | cut -f1)
              echo "${WINDOWS_ROLE_NAME} 未压缩目录大小: $(( DIR_SIZE / 1048576 )) MB"
            done

            # App 与 WebBackend 仍是可以单独复制的完整目录；同机完整包通过
            # WIM hard-link metadata 只保存一次相同模型/运行时文件。普通 7z
            # 格式不支持保存 hard links，不能用 solid compression 冒充复用。
            HARDLINK_PROBE_REL="_internal/models/audio-separator/BS-Rofo-SW-Fixed.yaml"
            APP_PROBE="dist/${WINDOWS_APP_NAME}/${HARDLINK_PROBE_REL}"
            BACKEND_PROBE="dist/${WINDOWS_BACKEND_NAME}/${HARDLINK_PROBE_REL}"
            python - "$APP_PROBE" "$BACKEND_PROBE" <<'PY'
          import os
          import sys
          from pathlib import Path

          app_path, backend_path = map(Path, sys.argv[1:])
          for path in (app_path, backend_path):
              if not path.is_file() or path.stat().st_size <= 0:
                  raise SystemExit(f"shared portable probe is missing or empty: {path}")
          if not os.path.samefile(app_path, backend_path):
              raise SystemExit(
                  "App and WebBackend shared asset is not an NTFS hard link: "
                  f"{app_path} != {backend_path}"
              )
          print(f"Input hard-link probe verified: {app_path} == {backend_path}")
          PY

            cd dist && 7z a -twim -snh -mx=5 -mmt=on -v1900m \
              "../${WINDOWS_SHARED_NAME}-Portable.wim" \
              "${WINDOWS_APP_NAME}" "${WINDOWS_BACKEND_NAME}" "${WINDOWS_FRONTEND_NAME}" && cd ..
            SHARED_ARCHIVE="${WINDOWS_SHARED_NAME}-Portable.wim.001"
            test -s "$SHARED_ARCHIVE" || {
              echo "::error::Shared Windows WIM first volume is missing: ${SHARED_ARCHIVE}"
              exit 1
            }
            7z t "$SHARED_ARCHIVE"

            HARDLINK_PROBE_ROOT="${RUNNER_TEMP:-$PWD/.tmp}/music-to-midi-wim-hardlink-probe"
            rm -rf "$HARDLINK_PROBE_ROOT"
            mkdir -p "$HARDLINK_PROBE_ROOT"
            7z x "$SHARED_ARCHIVE" \
              "${WINDOWS_APP_NAME}/${HARDLINK_PROBE_REL}" \
              "${WINDOWS_BACKEND_NAME}/${HARDLINK_PROBE_REL}" \
              "-o${HARDLINK_PROBE_ROOT}" -y
            python - \
              "${HARDLINK_PROBE_ROOT}/${WINDOWS_APP_NAME}/${HARDLINK_PROBE_REL}" \
              "${HARDLINK_PROBE_ROOT}/${WINDOWS_BACKEND_NAME}/${HARDLINK_PROBE_REL}" <<'PY'
          import os
          import sys
          from pathlib import Path

          app_path, backend_path = map(Path, sys.argv[1:])
          if not app_path.is_file() or not backend_path.is_file():
              raise SystemExit("WIM hard-link probe did not extract both role files")
          if not os.path.samefile(app_path, backend_path):
              raise SystemExit(
                  "WIM extraction did not restore App/WebBackend shared hard link: "
                  f"{app_path} != {backend_path}"
              )
          print(f"Extracted WIM hard-link probe verified: {app_path} == {backend_path}")
          PY
            rm -rf "$HARDLINK_PROBE_ROOT"

            # 局域网其他电脑只需这个轻量前端包，无需下载模型或 CUDA 运行时。
            cd dist && 7z a -tzip "../${WINDOWS_FRONTEND_NAME}-Portable.zip" "${WINDOWS_FRONTEND_NAME}" && cd ..
            7z t "${WINDOWS_FRONTEND_NAME}-Portable.zip"
          else
            LINUX_SHARED_NAME="MusicToMidi-${{ matrix.platform }}-${{ matrix.variant }}"
            LINUX_APP_NAME="${LINUX_SHARED_NAME}-App"
            LINUX_BACKEND_NAME="${LINUX_SHARED_NAME}-WebBackend"
            LINUX_FRONTEND_NAME="MusicToMidi-${{ matrix.platform }}-WebFrontend"
            LINUX_ROLE_NAMES=(
              "${LINUX_APP_NAME}"
              "${LINUX_BACKEND_NAME}"
              "${LINUX_FRONTEND_NAME}"
            )
            for LINUX_ROLE_NAME in "${LINUX_ROLE_NAMES[@]}"; do
              test -d "dist/${LINUX_ROLE_NAME}" || {
                echo "::error::Linux portable role directory is missing: dist/${LINUX_ROLE_NAME}"
                exit 1
              }
              DIR_SIZE=$(du -sb "dist/${LINUX_ROLE_NAME}" | cut -f1)
              echo "${LINUX_ROLE_NAME} 未压缩目录大小: $(( DIR_SIZE / 1048576 )) MB"
            done

            HARDLINK_PROBE_REL="_internal/models/audio-separator/BS-Rofo-SW-Fixed.yaml"
            python - \
              "dist/${LINUX_APP_NAME}/${HARDLINK_PROBE_REL}" \
              "dist/${LINUX_BACKEND_NAME}/${HARDLINK_PROBE_REL}" <<'PY'
          import os
          import sys
          from pathlib import Path

          app_path, backend_path = map(Path, sys.argv[1:])
          for path in (app_path, backend_path):
              if not path.is_file() or path.stat().st_size <= 0:
                  raise SystemExit(f"shared Linux portable probe is missing or empty: {path}")
          if not os.path.samefile(app_path, backend_path):
              raise SystemExit(
                  "Linux App and WebBackend shared asset is not a hard link: "
                  f"{app_path} != {backend_path}"
              )
          print(f"Linux input hard-link probe verified: {app_path} == {backend_path}")
          PY

            # Stream the three independently movable roles into one split archive.
            # GNU tar records the App/WebBackend hard links instead of storing the
            # model/runtime tree twice.
            tar -czf - -C dist "${LINUX_ROLE_NAMES[@]}" \
              | split -b 1900M - "${LINUX_SHARED_NAME}-Portable.tar.gz.part"
            test -s "${LINUX_SHARED_NAME}-Portable.tar.gz.partaa"

            LINUX_ARCHIVE_PROBE_ROOT="${RUNNER_TEMP:-$PWD/.tmp}/music-to-midi-linux-archive-probe"
            rm -rf "$LINUX_ARCHIVE_PROBE_ROOT"
            mkdir -p "$LINUX_ARCHIVE_PROBE_ROOT"
            cat "${LINUX_SHARED_NAME}-Portable.tar.gz.part"* \
              | tar -xzf - -C "$LINUX_ARCHIVE_PROBE_ROOT" \
                "${LINUX_APP_NAME}/${HARDLINK_PROBE_REL}" \
                "${LINUX_BACKEND_NAME}/${HARDLINK_PROBE_REL}" \
                "${LINUX_FRONTEND_NAME}/MusicToMidiFrontend"
            python - \
              "$LINUX_ARCHIVE_PROBE_ROOT/${LINUX_APP_NAME}/${HARDLINK_PROBE_REL}" \
              "$LINUX_ARCHIVE_PROBE_ROOT/${LINUX_BACKEND_NAME}/${HARDLINK_PROBE_REL}" \
              "$LINUX_ARCHIVE_PROBE_ROOT/${LINUX_FRONTEND_NAME}/MusicToMidiFrontend" <<'PY'
          import os
          import sys
          from pathlib import Path

          app_path, backend_path, frontend_path = map(Path, sys.argv[1:])
          if not app_path.is_file() or not backend_path.is_file():
              raise SystemExit("Linux archive probe did not extract both shared role files")
          if not os.path.samefile(app_path, backend_path):
              raise SystemExit(
                  "Linux archive extraction did not restore the App/WebBackend hard link: "
                  f"{app_path} != {backend_path}"
              )
          if not frontend_path.is_file() or frontend_path.stat().st_size <= 0:
              raise SystemExit("Linux archive probe did not extract a valid WebFrontend executable")
          print("Linux unified archive restored App, WebBackend, and WebFrontend contracts")
          PY
            rm -rf "$LINUX_ARCHIVE_PROBE_ROOT"

            # Also publish the inference-free frontend as a small standalone copy.
            tar -czf "${LINUX_FRONTEND_NAME}-Portable.tar.gz" \
              -C dist "${LINUX_FRONTEND_NAME}"
            tar -tzf "${LINUX_FRONTEND_NAME}-Portable.tar.gz" >/dev/null
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: MusicToMidi-${{ matrix.platform }}-${{ matrix.variant }}
          path: MusicToMidi-${{ matrix.platform }}-*-Portable*

  release:
    name: 上传到 GitHub Release
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: 检出发布源码
        uses: actions/checkout@v6

      - name: 下载所有构建产物
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: 列出构建产物
        run: ls -lh MusicToMidi-*

      - name: 确定目标标签
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            LATEST=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName -q '.[0].tagName')
            echo "tag=${LATEST}" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 校验 pyproject、运行时版本与发布标签一致
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python - <<'PY'
          import ast
          import os
          import tomllib
          from pathlib import Path

          project_version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          module = ast.parse(Path("src/__init__.py").read_text(encoding="utf-8"))
          runtime_version = next(
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
          )
          release_tag = os.environ["RELEASE_TAG"].strip()
          expected_tag = f"v{project_version}"
          if runtime_version != project_version:
              raise SystemExit(
                  f"Version mismatch: pyproject.toml={project_version}, src.__version__={runtime_version}"
              )
          if release_tag != expected_tag:
              raise SystemExit(
                  f"Release tag mismatch: expected {expected_tag} from project version, got {release_tag!r}"
              )
          print(f"Version contract verified: {release_tag}")
          PY

      - name: 创建 Release（如不存在）
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if ! gh release view "${TAG}" --repo ${{ github.repository }} &>/dev/null; then
            gh release create "${TAG}" \
              --repo ${{ github.repository }} \
              --title "${TAG}" \
              --notes "正在准备发布说明..."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 更新 Release 说明
        run: |
          NOTES_PATH="docs/releases/${TAG}.md"
          test -s "$NOTES_PATH"
          cp "$NOTES_PATH" release-notes.md
          gh release edit "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --notes-file release-notes.md
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 删除旧 CPU 发布资产
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "清理 Release 中的旧 CPU 资产: ${TAG}"
          mapfile -t CPU_ASSETS < <(
            gh release view "${TAG}" \
              --repo ${{ github.repository }} \
              --json assets \
              -q '.assets[].name | select(test("^MusicToMidi-.*-CPU-Portable"))'
          )
          if [ "${#CPU_ASSETS[@]}" -eq 0 ]; then
            echo "未发现旧 CPU 资产"
            exit 0
          fi
          for asset in "${CPU_ASSETS[@]}"; do
            echo "删除旧 CPU 资产: ${asset}"
            gh release delete-asset "${TAG}" "${asset}" \
              --repo ${{ github.repository }} \
              --yes
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传资源到 Release
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "上传资源到 Release: ${TAG}"
          mapfile -t FILES < <(find . -maxdepth 1 -name "MusicToMidi-*-Portable*" -type f | sort)
          upload_asset_with_retry() {
            local tag="$1"
            local file="$2"
            local attempt
            local exit_code

            for attempt in 1 2 3; do
              echo "上传(${attempt}/3): ${file}"
              if timeout 30m gh release upload "${tag}" "${file}" \
                --repo ${{ github.repository }} \
                --clobber; then
                return 0
              fi

              exit_code=$?
              echo "上传失败(退出码=${exit_code}): ${file}"
              if [ "${attempt}" -lt 3 ]; then
                sleep $(( attempt * 20 ))
              fi
            done

            echo "上传最终失败: ${file}"
            return 1
          }
          echo "找到以下文件："
          for f in "${FILES[@]}"; do
            SIZE=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            echo "  $f ($(( SIZE / 1048576 )) MB)"
          done
          for f in "${FILES[@]}"; do
            upload_asset_with_retry "${TAG}" "$f"
          done
          echo "全部上传完成"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
