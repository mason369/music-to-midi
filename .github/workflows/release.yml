          本目录内置完整模型、CUDA 运行时、FluidSynth 与 FFmpeg，可以脱离桌面 App 目录单独复制和运行。
          Web 服务不内置认证、授权或 TLS，适用范围是受信任局域网。公网单一所有者场景由同版本 Docker 高级部署提供 HTTPS 和 Basic Auth。
