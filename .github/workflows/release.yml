          输出格式：多轨道 MIDI（128 种 GM 乐器）

          处理模式（完整 7 种）：
            1. SMART：完整混音多乐器转写
            2. VOCAL_SPLIT：Leap XE 人声 + Leap Instrumental 伴奏，生成两条 WAV
