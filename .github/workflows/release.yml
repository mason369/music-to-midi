name: 发布版本

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要上传资源的 Release 标签（如 v1.0.0），留空则上传到最新 Release'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            variant: GPU
            platform: Windows
            pytorch_url: https://download.pytorch.org/whl/cu128
            sep: ";"
          - os: ubuntu-22.04
            variant: GPU
            platform: Linux
            pytorch_url: https://download.pytorch.org/whl/cu128
            sep: ":"

    runs-on: ${{ matrix.os }}
    name: 构建 ${{ matrix.platform }}-${{ matrix.variant }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 阻断未解决的第三方许可证发布
        shell: bash
        run: |
          FAILED=0
          if grep -n "^RELEASE_BLOCKER_UNRESOLVED_LICENSE:" THIRD_PARTY_NOTICES.md; then
            echo "::error::THIRD_PARTY_NOTICES.md contains unresolved redistribution/license blockers. Portable release is forbidden until every marker is resolved."
            FAILED=1
          fi
          EXPECTED_COMPONENTS=(
            zfturbo_adapted_source
            yourmt3_checkpoints
            yourmt3_patched_source
            leap_xe
            leap_instrumental
            bs_roformer_sw_fixed
            audio_separator
            transkun_source
            transkun_default_v2_weight
            transkun_v2_aug
            aria_amt_source
            aria_amt_checkpoint
            bytedance_inference
            bytedance_checkpoint
            miros_source
            musicfm_pretrained
            miros_finetuned
            muscriptor_source
            chordmini_btc
            beat_this_runtime_and_final0
            muscriptor_small_checkpoint
            muscriptor_medium_checkpoint
            muscriptor_large_checkpoint
            musescore_general_soundfont
            musescore_studio
            fluidsynth_runtime
            pytorch_cuda_runtime
            onnxruntime_gpu
            pyqt6_runtime
            ffmpeg_runtime
            frozen_dependency_set
          )
          mapfile -t INVENTORY_LINES < <(grep '^PORTABLE_COMPONENT:' THIRD_PARTY_NOTICES.md || true)
          if [ "${#INVENTORY_LINES[@]}" -ne "${#EXPECTED_COMPONENTS[@]}" ]; then
            echo "::error::Portable license inventory count mismatch: expected ${#EXPECTED_COMPONENTS[@]}, got ${#INVENTORY_LINES[@]}"
            FAILED=1
          fi
          for component_id in "${EXPECTED_COMPONENTS[@]}"; do
            if ! grep -Fq "PORTABLE_COMPONENT: ${component_id} |" THIRD_PARTY_NOTICES.md; then
              echo "::error::Portable license inventory is missing required component: ${component_id}"
              FAILED=1
            fi
          done
          for inventory_line in "${INVENTORY_LINES[@]}"; do
            component_id=${inventory_line#PORTABLE_COMPONENT: }
            component_id=${component_id%% |*}
            if [[ " ${EXPECTED_COMPONENTS[*]} " != *" ${component_id} "* ]]; then
              echo "::error::Portable license inventory contains an unreviewed component ID: ${component_id}"
              FAILED=1
            fi
            if [[ ! "$inventory_line" =~ \|\ bundle=.+\ \|\ artifact=.+\ \|\ revision=.+\ \|\ license=.+\ \|\ status=(VERIFIED|BLOCKED|OWNER_ACCEPTED)$ ]]; then
              echo "::error::Malformed portable license inventory row: ${inventory_line}"
              FAILED=1
            elif [[ "$inventory_line" == *"| status=BLOCKED" ]]; then
              echo "::error::Portable component is not cleared for redistribution: ${component_id}"
              FAILED=1
            elif [[ "$inventory_line" == *"| status=OWNER_ACCEPTED" ]] && ! grep -Fq "OWNER_ACCEPTED_NOTICE: ${component_id}" THIRD_PARTY_NOTICES.md; then
              echo "::error::Owner-accepted component is missing its distribution record: ${component_id}"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装系统依赖 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            ffmpeg \
            fluidsynth \
            libsndfile1 \
            libportaudio2 \
            portaudio19-dev \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-util1 \
            libgl1 \
            libegl1 \
            libasound2 \
            libfontconfig1 \
            pulseaudio \
            pulseaudio-utils \
            fonts-ubuntu \
            fonts-dejavu-core

      - name: 启动虚拟音频输出 (Linux)
        if: runner.os == 'Linux'
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink \
            sink_name=music_to_midi_ci rate=44100 channels=2
          pactl set-default-sink music_to_midi_ci
          pactl info

      - name: 安装并验证虚拟音频输出 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version 3.0
          $ProgressPreference = 'SilentlyContinue'

          # The exact Pack43 archive, publisher identity, devcon binary, INF,
          # and hardware ID follow current successful windows-2025 cubeb audio CI.
          $driverUrl = 'https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack43.zip'
          $expectedZipHash = '66FD0A4D9F4896FF41632B7E3D53892C085C4561F53E8AE8D0F0BC10EEDD1CDD'
          $expectedThumbprint = '00859AAC6A54B8C1B3C139DE67846E64E7B82DB2'
          $devconUrl = 'https://raw.githubusercontent.com/LABSN/sound-ci-helpers/20a2b9bbd21fd005d8fe89933901506dba84ea4e/windows/devcon.exe'
          $expectedDevconHash = '97CFF42F8C0FE4FBDF991273159516BF78090625A933C3983EBD6F62284E329A'
          $hardwareId = 'VBAudioVACWDM'
          $workDir = Join-Path $env:RUNNER_TEMP "vbcable-$([Guid]::NewGuid().ToString('N'))"
          $archivePath = Join-Path $workDir 'VBCABLE_Driver_Pack43.zip'
          $extractDir = Join-Path $workDir 'driver'
          $devconPath = Join-Path $workDir 'devcon.exe'
          New-Item -ItemType Directory -Path $workDir, $extractDir | Out-Null

          Invoke-WebRequest -Uri $driverUrl -OutFile $archivePath -TimeoutSec 120
          $actualZipHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actualZipHash -ne $expectedZipHash) {
            throw "VB-CABLE 压缩包 SHA-256 不匹配：预期 $expectedZipHash，实际 $actualZipHash"
          }
          Invoke-WebRequest -Uri $devconUrl -OutFile $devconPath -TimeoutSec 120
          $actualDevconHash = (Get-FileHash -LiteralPath $devconPath -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actualDevconHash -ne $expectedDevconHash) {
            throw "devcon.exe SHA-256 不匹配：预期 $expectedDevconHash，实际 $actualDevconHash"
          }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractDir

          $catalogPath = Join-Path $extractDir 'vbaudio_cable64_win7.cat'
          $signature = Get-AuthenticodeSignature -LiteralPath $catalogPath
          if ($signature.Status -ne 'Valid') {
            throw "VB-CABLE 驱动目录签名无效：$($signature.Status)"
          }
          $certificate = $signature.SignerCertificate
          if ($null -eq $certificate -or $certificate.Thumbprint -ne $expectedThumbprint) {
            $actualThumbprint = if ($null -eq $certificate) { '<missing>' } else { $certificate.Thumbprint }
            throw "VB-CABLE 发布者证书不匹配：预期 $expectedThumbprint，实际 $actualThumbprint"
          }

          $store = [System.Security.Cryptography.X509Certificates.X509Store]::new(
            'TrustedPublisher',
            'LocalMachine'
          )
          $store.Open('ReadWrite')
          try {
            $store.Add($certificate)
          } finally {
            $store.Close()
          }

          foreach ($serviceName in @('AudioEndpointBuilder', 'Audiosrv')) {
            Set-Service -Name $serviceName -StartupType Automatic
            $service = Get-Service -Name $serviceName
            if ($service.Status -ne 'Running') {
              Start-Service -Name $serviceName
            }
          }

          $infPath = Join-Path $extractDir 'vbMmeCable64_win7.inf'
          if (-not (Test-Path -LiteralPath $infPath -PathType Leaf)) {
            throw "VB-CABLE INF 不存在：$infPath"
          }
          & $devconPath install $infPath $hardwareId
          if ($LASTEXITCODE -ne 0) {
            throw "devcon.exe 安装 VB-CABLE 失败，退出码：$LASTEXITCODE"
          }

          Start-Sleep -Seconds 5
          $audioEndpoints = @(Get-PnpDevice -Class AudioEndpoint -PresentOnly)
          $audioEndpoints | Format-Table -AutoSize Status, Class, FriendlyName, InstanceId
          $renderEndpoints = @($audioEndpoints | Where-Object {
              $_.FriendlyName -eq 'Speakers (VB-Audio Virtual Cable)' -and $_.Status -eq 'OK'
            })
          if ($renderEndpoints.Count -eq 0) {
            throw 'VB-CABLE 播放端点 Speakers (VB-Audio Virtual Cable) 未出现或状态不是 OK'
          }

      - name: 安装 FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Pin a final monthly build: BtbN retains monthly builds for two years,
          # while ordinary daily autobuilds are removed after about fourteen days.
          $releaseTag = "autobuild-2026-07-31-14-10"
          $assetName = "ffmpeg-n7.1.5-12-g1fdbca85aa-win64-gpl-7.1.zip"
          $expectedSha256 = "c067a1ca58f4fc4449f4bab0890fbcd65cbb3e5f46e066cf9c768e06c0c1d4d9"
          $downloadUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/$releaseTag/$assetName"
          $archivePath = Join-Path $env:RUNNER_TEMP $assetName
          $extractRoot = Join-Path $env:GITHUB_WORKSPACE ".tmp\ffmpeg-windows"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath
          $actualSha256 = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Pinned FFmpeg archive SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
          }

          if (Test-Path -LiteralPath $extractRoot) {
            Remove-Item -LiteralPath $extractRoot -Recurse -Force
          }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractRoot -Force
          $ffmpegExe = Get-ChildItem -LiteralPath $extractRoot -Recurse -File -Filter "ffmpeg.exe" | Select-Object -First 1
          if (-not $ffmpegExe) {
            throw "Pinned FFmpeg archive does not contain ffmpeg.exe"
          }
          $ffprobeExe = Join-Path $ffmpegExe.DirectoryName "ffprobe.exe"
          if (-not (Test-Path -LiteralPath $ffprobeExe -PathType Leaf)) {
            throw "Pinned FFmpeg archive does not contain ffprobe.exe beside ffmpeg.exe"
          }

          $ffmpegExe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "FFMPEG_RELEASE_BIN=$($ffmpegExe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FFPROBE_RELEASE_BIN=$ffprobeExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FFMPEG_PACKAGE_SOURCE=BtbN FFmpeg-Builds release: $downloadUrl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FFMPEG_PACKAGE_VERSION=$assetName (sha256:$expectedSha256)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 记录并校验实际打包的 FFmpeg
        shell: bash
        run: |
          mkdir -p .tmp
          if [ "${{ runner.os }}" = "Windows" ]; then
            FFMPEG_BIN=$(cygpath -u "$FFMPEG_RELEASE_BIN")
            FFPROBE_BIN=$(cygpath -u "$FFPROBE_RELEASE_BIN")
            PACKAGE_SOURCE="$FFMPEG_PACKAGE_SOURCE"
            PACKAGE_VERSION="$FFMPEG_PACKAGE_VERSION"
          else
            FFMPEG_BIN=$(readlink -f "$(command -v ffmpeg)")
            FFPROBE_BIN=$(readlink -f "$(command -v ffprobe)")
            PACKAGE_SOURCE="Ubuntu 22.04 apt ffmpeg source route: https://packages.ubuntu.com/jammy/ffmpeg"
            PACKAGE_VERSION=$(dpkg-query -W -f='${Package}=${Version}' ffmpeg)
          fi
          test -x "$FFMPEG_BIN" || { echo "Exact FFmpeg bundle executable missing: $FFMPEG_BIN" >&2; exit 1; }
          test -x "$FFPROBE_BIN" || { echo "Exact ffprobe bundle executable missing: $FFPROBE_BIN" >&2; exit 1; }

          BUILD_CONF=$("$FFMPEG_BIN" -hide_banner -buildconf 2>&1)
          if printf '%s\n' "$BUILD_CONF" | grep -F -- '--enable-nonfree'; then
            echo "::error::FFmpeg was built with --enable-nonfree and is not redistributable; refusing portable build."
            exit 1
          fi

          {
            echo "Package source: $PACKAGE_SOURCE"
            echo "Package version: $PACKAGE_VERSION"
            echo "Bundled ffmpeg path: $FFMPEG_BIN"
            echo "Bundled ffprobe path: $FFPROBE_BIN"
            echo
            echo "=== ffmpeg -version ==="
            "$FFMPEG_BIN" -version
            echo
            echo "=== ffmpeg -buildconf ==="
            "$FFMPEG_BIN" -hide_banner -buildconf
            echo
            echo "=== ffmpeg -L ==="
            "$FFMPEG_BIN" -hide_banner -L
            echo
            echo "=== SHA-256 ==="
            sha256sum "$FFMPEG_BIN" "$FFPROBE_BIN"
          } > .tmp/FFMPEG_BUILD_AUDIT.txt
          test -s .tmp/FFMPEG_BUILD_AUDIT.txt
          cat .tmp/FFMPEG_BUILD_AUDIT.txt

      - name: 安装 Python 依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python - <<'PY'
          from pathlib import Path

          skip_prefixes = (
              "torch",
              "torchaudio",
              "torchvision",
              "numpy",
              "audio-separator",
              "pytorch-lightning",
              "torchmetrics",
              "onnxruntime",
          )
          requirements = Path("requirements.txt").read_text(encoding="utf-8").splitlines()
          filtered = [
              line for line in requirements
              if not any(line.strip().startswith(prefix) for prefix in skip_prefixes)
          ]
          target = Path(".tmp/requirements-build.txt")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text("\n".join(filtered) + "\n", encoding="utf-8")
          PY
          pip install numpy==1.26.4
          pip install -r .tmp/requirements-build.txt
          pip install torch==2.7.0 torchaudio==2.7.0 torchvision==0.22.0 --index-url ${{ matrix.pytorch_url }}
          pip install "aria-amt @ https://github.com/EleutherAI/aria-amt/archive/a1ab73fc901d1759ec3bc173c146b3c6a3040261.zip" --no-deps
          pip install "muscriptor @ https://github.com/muscriptor/muscriptor/archive/d73147e75e5b9b0c0a79ebe154587db4fd603e0c.zip" --no-deps
          pip install Pillow==12.0.0 pytorch-lightning==2.6.1 torchmetrics==1.8.2 onnxruntime-gpu==1.23.2
          pip install beartype==0.18.5 diffq-fixed==0.2.4 julius==0.2.7 ml_collections==1.1.0 onnx-weekly==1.21.0.dev20260223 onnx2torch-py313==1.6.0 pydub==0.25.1 resampy==0.4.3 rotary-embedding-torch==0.6.5 samplerate==0.1.0 six==1.17.0
          pip install audio-separator==0.44.1 --no-deps
          pip install pyinstaller pytest pytest-timeout

      - name: 校验 Qt 默认音频输出 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: |
          @'
          from PyQt6.QtCore import QCoreApplication
          from PyQt6.QtMultimedia import QMediaDevices

          app = QCoreApplication([])
          outputs = QMediaDevices.audioOutputs()
          default_output = QMediaDevices.defaultAudioOutput()
          descriptions = [device.description() for device in outputs]
          if default_output.isNull():
              raise SystemExit('Qt 没有检测到默认音频输出设备')
          if not any('VB-Audio Virtual Cable' in description for description in descriptions):
              raise SystemExit(f'Qt 没有检测到 VB-CABLE 播放端点：{descriptions}')
          if 'VB-Audio Virtual Cable' not in default_output.description():
              raise SystemExit(f'Qt 默认输出不是 VB-CABLE：{default_output.description()}')
          print(f'Qt 默认音频输出：{default_output.description()}')
          print(f'Qt 可用音频输出：{descriptions}')
          '@ | python -
          if ($LASTEXITCODE -ne 0) {
            throw "Qt 音频输出探针失败，退出码：$LASTEXITCODE"
          }

      - name: 运行便携发布回归测试
        run: |
          pytest -vv --timeout=60 --timeout-method=thread tests/test_main_self_test.py tests/test_portable_release_contract.py tests/test_portable_model_asset_validator.py tests/test_runtime_paths.py tests/test_yourmt3_availability_messages.py tests/test_official_midi_routes.py tests/test_muscriptor_integration.py tests/test_sota_model_downloader.py

      - name: 下载 AI 模型（打包到便携版）
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Windows: use the exact hash-verified BtbN directory in Git Bash too.
          if [ "${{ runner.os }}" = "Windows" ]; then
            export PATH="$(dirname "$(cygpath -u "$FFMPEG_RELEASE_BIN")"):$PATH"
          fi

          echo "=== Restore and strictly verify pinned MIROS before the aggregate downloader ==="
          WORKSPACE_DIR="$(pwd)"
          MIROS_PORTABLE_RELEASE_TAG="v1.0.16"
          MIROS_PORTABLE_ROOT="$WORKSPACE_DIR/.tmp/miros-portable"
          rm -rf "$MIROS_PORTABLE_ROOT" "$WORKSPACE_DIR/external/ai4m-miros"
          mkdir -p "$MIROS_PORTABLE_ROOT" "$WORKSPACE_DIR/external"
          MIROS_PORTABLE_PARTS="$WORKSPACE_DIR/.tmp/miros-portable-parts.tsv"
          gh release view "$MIROS_PORTABLE_RELEASE_TAG" \
            --repo ${{ github.repository }} \
            --json assets \
            -q '.assets[] | select(.name | startswith("MusicToMidi-Linux-GPU-Portable.tar.gz.part")) | [.name, .url] | @tsv' \
            | sort > "$MIROS_PORTABLE_PARTS"
          if [ ! -s "$MIROS_PORTABLE_PARTS" ]; then
            echo "::error::No Linux portable release parts found on ${MIROS_PORTABLE_RELEASE_TAG}; cannot restore the packaged MIROS checkpoint."
            exit 1
          fi
          echo "Streaming packaged MIROS backend from ${MIROS_PORTABLE_RELEASE_TAG}"
          (
            while IFS=$'\t' read -r asset_name asset_url; do
              echo "Streaming ${asset_name}" >&2
              curl -L --fail --retry 3 --retry-delay 5 "$asset_url"
            done < "$MIROS_PORTABLE_PARTS"
          ) | tar -xz -C "$MIROS_PORTABLE_ROOT" --wildcards "MusicToMidi-Linux-GPU/_internal/external/ai4m-miros/*"
          mv "$MIROS_PORTABLE_ROOT/MusicToMidi-Linux-GPU/_internal/external/ai4m-miros" "$WORKSPACE_DIR/external/ai4m-miros"
          test -f "$WORKSPACE_DIR/external/ai4m-miros/main.py"
          test -f "$WORKSPACE_DIR/external/ai4m-miros/transcribe.py"
          test -f "$WORKSPACE_DIR/external/ai4m-miros/model/musicfm/data/pretrained_msd.pt"
          test -f "$WORKSPACE_DIR/external/ai4m-miros/logs/Multi_longer_seq_length_frozen_enc_silu/le2bzt53/checkpoints/last.ckpt"
          python download_miros_model.py

          echo "=== Download and verify the complete seven-mode asset set, including gated MuScriptor Small/Medium/Large and the official playback SoundFont ==="
          python download_sota_models.py
          python download_fluidsynth_runtime.py
          python download_musescore_runtime.py

          echo "=== Verify Leap XE 90-band vocals assets ==="
          python download_vocal_model.py

          echo "=== Verify BS-RoFormer SW six-stem assets (Fixed checkpoint) ==="
          python download_multistem_model.py --check-only

          echo "=== Verify Leap Instrumental accompaniment assets ==="
          python download_accompaniment_model.py

          echo "=== Verify TransKun V2 Aug checkpoint assets ==="
          python download_transkun_v2_aug_model.py

          echo "=== Download Aria-AMT piano model ==="
          python download_aria_amt_model.py

          echo "=== Download ByteDance pedal piano model ==="
          python download_bytedance_piano_model.py

          echo "=== Verify downloaded models ==="
          echo "YourMT3+ (5 checkpoints):"
          find ~/.cache/music_ai_models/yourmt3_all -name "*.ckpt" -exec ls -lh {} \;
          echo "Audio-Separator:"
          find ~/.music-to-midi/models/audio-separator -maxdepth 3 -type f -exec ls -lh {} \;
          echo "TransKun V2 Aug:"
          find ~/.cache/music_ai_models/transkun_v2_aug -maxdepth 3 -type f -exec ls -lh {} \;
          echo "Aria-AMT:"
          ls -lh ~/.cache/music_ai_models/aria_amt/*
          echo "ByteDance Pedal:"
          ls -lh ~/.cache/music_ai_models/bytedance_piano/*
          echo "Beat This final0:"
          ls -lh ~/.music-to-midi/models/beat_this/final0.ckpt
          echo "MIROS (source + pretrained + fine-tuned):"
          ls -lh external/ai4m-miros/model/musicfm/data/pretrained_msd.pt
          ls -lh external/ai4m-miros/logs/Multi_longer_seq_length_frozen_enc_silu/le2bzt53/checkpoints/last.ckpt
          echo "MuScriptor Small/Medium/Large (three checkpoints + configs + SoundFont + FluidSynth):"
          python - <<'PY'
          from src.utils.muscriptor_downloader import get_cached_muscriptor_paths
          from src.utils.muscriptor_soundfont_downloader import download_muscriptor_soundfont
          from src.utils.fluidsynth_runtime import get_fluidsynth_executable
          from src.utils.musescore_runtime import validate_pinned_musescore_distribution

          for model_size in ("small", "medium", "large"):
              weights, config = get_cached_muscriptor_paths(
                  model_size,
                  validate_hashes=True,
              )
              print(f"{model_size}: {weights}")
              print(f"{model_size}: {config}")
          print(download_muscriptor_soundfont(printer=lambda _message: None))
          print(get_fluidsynth_executable())
          print(validate_pinned_musescore_distribution())
          PY
          python - <<'PY'
          from src.core.miros_transcriber import MirosTranscriber
          reason = MirosTranscriber.get_unavailable_reason()
          if reason:
              raise RuntimeError(reason)
          if not MirosTranscriber.is_model_available():
              raise RuntimeError("MIROS model files are not available")
          print("MIROS available")
          PY

      - name: 修复 Torch OpenMP 运行时 (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install zstandard
          python tools/repair_torch_openmp.py

      - name: 准备 Linux 便携打包资源
        if: runner.os == 'Linux'
        shell: bash
        run: |
          BUILD_ASSET_ROOT="$GITHUB_WORKSPACE/build/portable_assets"
          mkdir -p "$BUILD_ASSET_ROOT"

          cp -a "$HOME/.music-to-midi/models/audio-separator" "$BUILD_ASSET_ROOT/audio-separator"

          cp -a "$HOME/.cache/music_ai_models/yourmt3_all" "$BUILD_ASSET_ROOT/yourmt3_all"

          cp -a "$HOME/.cache/music_ai_models/aria_amt" "$BUILD_ASSET_ROOT/aria_amt"

          cp -a "$HOME/.cache/music_ai_models/bytedance_piano" "$BUILD_ASSET_ROOT/bytedance_piano"

          cp -a "$HOME/.music-to-midi/models/beat_this" "$BUILD_ASSET_ROOT/beat_this"

          cp -a "$HOME/.cache/music_ai_models/transkun_v2_aug" "$BUILD_ASSET_ROOT/transkun_v2_aug"

          cp -a "$HOME/.cache/music_ai_models/musescore/4.7.4" "$BUILD_ASSET_ROOT/musescore"

          cp -a "$GITHUB_WORKSPACE/external/ai4m-miros" "$BUILD_ASSET_ROOT/ai4m-miros"

          BUILD_ASSET_ROOT="$BUILD_ASSET_ROOT" python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          from src.utils.muscriptor_downloader import get_cached_muscriptor_paths
          from src.utils.muscriptor_soundfont_downloader import (
              MUSCRIPTOR_SF2_FILENAME,
              download_muscriptor_soundfont,
          )

          root = Path(os.environ["BUILD_ASSET_ROOT"])
          assets_dir = root / "muscriptor_assets"
          assets_dir.mkdir(parents=True, exist_ok=True)
          for model_size in ("small", "medium", "large"):
              model_dir = root / f"muscriptor_{model_size}"
              model_dir.mkdir(parents=True, exist_ok=True)
              weights, config = get_cached_muscriptor_paths(
                  model_size,
                  validate_hashes=True,
              )
              shutil.copy2(weights, model_dir / weights.name)
              shutil.copy2(config, model_dir / config.name)
          soundfont = download_muscriptor_soundfont(printer=lambda _message: None)
          shutil.copy2(soundfont, assets_dir / MUSCRIPTOR_SF2_FILENAME)
          PY

          FLUIDSYNTH_SOURCE="$(command -v fluidsynth)" || {
            echo "Required FluidSynth executable is missing" >&2
            exit 1
          }
          mkdir -p "$BUILD_ASSET_ROOT/fluidsynth/bin" "$BUILD_ASSET_ROOT/fluidsynth/lib"
          cp "$FLUIDSYNTH_SOURCE" "$BUILD_ASSET_ROOT/fluidsynth/bin/fluidsynth"
          ldd "$FLUIDSYNTH_SOURCE" | awk '/=> \/[^ ]+/ {print $3} /^\/[^( ]+/ {print $1}' | sort -u | while read -r library; do
            test -f "$library" || { echo "FluidSynth dependency missing: $library" >&2; exit 1; }
            cp -L "$library" "$BUILD_ASSET_ROOT/fluidsynth/lib/"
          done
          test -s "$BUILD_ASSET_ROOT/fluidsynth/bin/fluidsynth"

          python tools/validate_portable_model_assets.py \
            --audio-separator-dir "$BUILD_ASSET_ROOT/audio-separator" \
            --yourmt3-dir "$BUILD_ASSET_ROOT/yourmt3_all" \
            --yourmt3-source-dir "$GITHUB_WORKSPACE/YourMT3/amt/src" \
            --aria-amt-dir "$BUILD_ASSET_ROOT/aria_amt" \
            --bytedance-piano-dir "$BUILD_ASSET_ROOT/bytedance_piano" \
            --beat-this-dir "$BUILD_ASSET_ROOT/beat_this" \
            --miros-dir "$BUILD_ASSET_ROOT/ai4m-miros" \
            --musescore-executable "$BUILD_ASSET_ROOT/musescore/AppRun" \
            --label "staged Linux portable model assets"
          python download_multistem_model.py \
            --cache-dir "$BUILD_ASSET_ROOT/audio-separator" \
            --check-only
          TRANSKUN_V2_AUG_BUNDLE="$BUILD_ASSET_ROOT/transkun_v2_aug" python - <<'PY'
          import os
          from pathlib import Path

          from src.core.transkun_v2_aug_transcriber import (
              TRANSKUN_V2_AUG_MODEL_DIR_NAME,
              validate_transkun_v2_aug_model_files,
          )

          model_dir = (
              Path(os.environ["TRANSKUN_V2_AUG_BUNDLE"])
              / TRANSKUN_V2_AUG_MODEL_DIR_NAME
          )
          reason = validate_transkun_v2_aug_model_files(model_dir)
          if reason:
              raise RuntimeError(reason)
          print(f"TransKun V2 Aug staged assets verified: {model_dir}")
          PY

          FFMPEG_SOURCE="$(command -v ffmpeg)" || {
            echo "Required ffmpeg executable is missing" >&2
            exit 1
          }
          FFPROBE_SOURCE="$(command -v ffprobe)" || {
            echo "Required ffprobe executable is missing" >&2
            exit 1
          }
          mkdir -p "$BUILD_ASSET_ROOT/ffmpeg/bin"
          cp "$FFMPEG_SOURCE" "$BUILD_ASSET_ROOT/ffmpeg/bin/ffmpeg"
          cp "$FFPROBE_SOURCE" "$BUILD_ASSET_ROOT/ffmpeg/bin/ffprobe"
          test -s "$BUILD_ASSET_ROOT/ffmpeg/bin/ffmpeg"
          test -s "$BUILD_ASSET_ROOT/ffmpeg/bin/ffprobe"

          echo "MUSIC_TO_MIDI_BUNDLE_AUDIO_SEPARATOR_DIR=$BUILD_ASSET_ROOT/audio-separator" >> "$GITHUB_ENV"
          echo "MUSIC_TO_MIDI_BUNDLE_YOURMT3_DIR=$BUILD_ASSET_ROOT/yourmt3_all" >> "$GITHUB_ENV"
          echo "MUSIC_TO_MIDI_BUNDLE_ARIA_AMT_DIR=$BUILD_ASSET_ROOT/aria_amt" >> "$GITHUB_ENV"
          echo "MUSIC_TO_MIDI_BUNDLE_BYTEDANCE_PIANO_DIR=$BUILD_ASSET_ROOT/bytedance_piano" >> "$GITHUB_ENV"
          echo "MUSIC_TO_MIDI_BUNDLE_BEAT_THIS_DIR=$BUILD_ASSET_ROOT/beat_this" >> "$GITHUB_ENV"
          echo "MUSIC_TO_MIDI_BUNDLE_TRANSKUN_V2_AUG_DIR=$BUILD_ASSET_ROOT/transkun_v2_aug" >> "$GITHUB_ENV"
          echo "MUSIC_TO_MIDI_BUNDLE_MIROS_DIR=$BUILD_ASSET_ROOT/ai4m-miros" >> "$GITHUB_ENV"
          echo "MUSIC_TO_MIDI_BUNDLE_MUSCRIPTOR_SMALL_DIR=$BUILD_ASSET_ROOT/muscriptor_small" >> "$GITHUB_ENV"
          echo "MUSIC_TO_MIDI_BUNDLE_MUSCRIPTOR_MEDIUM_DIR=$BUILD_ASSET_ROOT/muscriptor_medium" >> "$GITHUB_ENV"
          echo "MUSIC_TO_MIDI_BUNDLE_MUSCRIPTOR_LARGE_DIR=$BUILD_ASSET_ROOT/muscriptor_large" >> "$GITHUB_ENV"
          echo "MUSIC_TO_MIDI_BUNDLE_MUSCRIPTOR_DIR=$BUILD_ASSET_ROOT/muscriptor_large" >> "$GITHUB_ENV"
          echo "MUSIC_TO_MIDI_BUNDLE_MUSCRIPTOR_ASSETS_DIR=$BUILD_ASSET_ROOT/muscriptor_assets" >> "$GITHUB_ENV"
          echo "MUSIC_TO_MIDI_BUNDLE_FLUIDSYNTH_DIR=$BUILD_ASSET_ROOT/fluidsynth" >> "$GITHUB_ENV"
          echo "MUSIC_TO_MIDI_BUNDLE_MUSESCORE_DIR=$BUILD_ASSET_ROOT/musescore" >> "$GITHUB_ENV"
          echo "MUSIC_TO_MIDI_BUNDLE_FFMPEG_DIR=$BUILD_ASSET_ROOT/ffmpeg" >> "$GITHUB_ENV"

      - name: 生成第三方 SBOM
        shell: bash
        run: python tools/generate_third_party_sbom.py --output THIRD_PARTY_SBOM.txt

      - name: 构建桌面、独立后端与独立 Web 前端 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonExe = Join-Path $env:pythonLocation 'python.exe'
          if (-not (Test-Path -LiteralPath $pythonExe -PathType Leaf)) {
            throw "actions/setup-python Python 不存在：$pythonExe"
          }
          & .\build_web_executables.ps1 -PythonExe $pythonExe

      - name: 构建桌面、独立后端与独立 Web 前端 (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller MusicToMidi.spec
          pyinstaller --noconfirm \
            --workpath build/pyinstaller-web-frontend \
            --distpath dist \
            MusicToMidiFrontend.spec
          python - <<'PY'
          from pathlib import Path

          from src.utils.artifact_identity import validate_file_identity
          from src.utils.muscriptor_downloader import (
              MUSCRIPTOR_ARTIFACTS,
              MUSCRIPTOR_CONFIG_FILENAME,
              MUSCRIPTOR_MODEL_FILENAME,
          )

          models_root = Path("dist/MusicToMidi/_internal/models")
          for model_size, artifact in MUSCRIPTOR_ARTIFACTS.items():
              model_dir = models_root / f"muscriptor_{model_size}"
              validate_file_identity(
                  model_dir / MUSCRIPTOR_MODEL_FILENAME,
                  expected_size=artifact.model_bytes,
                  expected_sha256=artifact.model_sha256,
                  label=f"packaged MuScriptor-{model_size} model",
              )
              validate_file_identity(
                  model_dir / MUSCRIPTOR_CONFIG_FILENAME,
                  expected_size=artifact.config_bytes,
                  expected_sha256=artifact.config_sha256,
                  label=f"packaged MuScriptor-{model_size} config",
              )
          print("Packaged MuScriptor Small/Medium/Large assets verified")
          PY
          cp LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_SBOM.txt dist/MusicToMidi/

          COMBINED_ROOT="$(pwd)/dist/MusicToMidi"
          APP_ROOT="$(pwd)/dist/MusicToMidi-App"
          BACKEND_ROOT="$(pwd)/dist/MusicToMidi-WebBackend"
          FRONTEND_SOURCE="$(pwd)/dist/MusicToMidiFrontend"
          FRONTEND_ROOT="$(pwd)/dist/MusicToMidi-WebFrontend"
          rm -rf "$APP_ROOT" "$BACKEND_ROOT" "$FRONTEND_ROOT"
          test -d "$COMBINED_ROOT"
          test -d "$FRONTEND_SOURCE"

          # Publish three independently movable Linux roles without duplicating
          # the large model/runtime tree on the runner. GNU cp preserves
          # symlinks and hard-links every regular file; GNU tar later preserves
          # those hard links in the unified archive.
          cp -al "$COMBINED_ROOT" "$APP_ROOT"
          cp -al "$COMBINED_ROOT" "$BACKEND_ROOT"
          touch "$APP_ROOT/.incomplete" "$BACKEND_ROOT/.incomplete"
          rm -f "$APP_ROOT/MusicToMidiBackend"
          rm -f "$BACKEND_ROOT/MusicToMidi"
          mv "$FRONTEND_SOURCE" "$FRONTEND_ROOT"

          test -x "$APP_ROOT/MusicToMidi"
          test -x "$APP_ROOT/MusicToMidiCLI"
          test ! -e "$APP_ROOT/MusicToMidiBackend"
          test -x "$BACKEND_ROOT/MusicToMidiBackend"
          test -x "$BACKEND_ROOT/MusicToMidiCLI"
          test ! -e "$BACKEND_ROOT/MusicToMidi"
          test -x "$FRONTEND_ROOT/MusicToMidiFrontend"
          test -d "$APP_ROOT/_internal"
          test -d "$BACKEND_ROOT/_internal"
          test -d "$FRONTEND_ROOT/_internal"

          HARDLINK_PROBE_REL="_internal/models/audio-separator/BS-Rofo-SW-Fixed.yaml"
          python - \
            "$APP_ROOT/$HARDLINK_PROBE_REL" \
            "$BACKEND_ROOT/$HARDLINK_PROBE_REL" <<'PY'
          import os
          import sys
          from pathlib import Path

          app_path, backend_path = map(Path, sys.argv[1:])
          for path in (app_path, backend_path):
              if not path.is_file() or path.stat().st_size <= 0:
                  raise SystemExit(f"shared Linux portable probe is missing or empty: {path}")
          if not os.path.samefile(app_path, backend_path):
              raise SystemExit(
                  "Linux App and WebBackend shared asset is not a hard link: "
                  f"{app_path} != {backend_path}"
              )
          print(f"Linux input hard-link probe verified: {app_path} == {backend_path}")
          PY

          rm -f "$APP_ROOT/.incomplete" "$BACKEND_ROOT/.incomplete"
          test ! -e "$APP_ROOT/.incomplete"
          test ! -e "$BACKEND_ROOT/.incomplete"
          rm -rf "$COMBINED_ROOT"

      - name: 烟测便携产物 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $appSmokeDir = (Resolve-Path -LiteralPath '.\dist\MusicToMidi-App').Path
          $backendSmokeDir = (Resolve-Path -LiteralPath '.\dist\MusicToMidi-WebBackend').Path
          $frontendSmokeDir = (Resolve-Path -LiteralPath '.\dist\MusicToMidi-WebFrontend').Path
          $runtimeRoots = @(
            (Join-Path $appSmokeDir 'runtime'),
            (Join-Path $backendSmokeDir 'runtime'),
            (Join-Path $frontendSmokeDir 'runtime')
          )
          $logs = Join-Path $appSmokeDir 'runtime\logs'
          foreach ($runtimeRoot in $runtimeRoots) {
            if (Test-Path -LiteralPath $runtimeRoot) {
              Remove-Item -LiteralPath $runtimeRoot -Recurse -Force
            }
          }
          $SelfTestTimeoutSeconds = 900
          $selfTestExe = Join-Path $appSmokeDir 'MusicToMidi.exe'
          $appCliExe = Join-Path $appSmokeDir 'MusicToMidiCLI.exe'
          $backendCliExe = Join-Path $backendSmokeDir 'MusicToMidiCLI.exe'
          foreach ($cliExe in @($appCliExe, $backendCliExe)) {
            if (-not (Test-Path -LiteralPath $cliExe -PathType Leaf)) {
              throw "Portable role is missing the native CLI executable: $cliExe"
            }
            $routeContract = & $cliExe routes --json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $routeContract.count -ne 13 -or $routeContract.routes.Count -ne 13) {
              throw "Packaged native CLI route smoke failed: $cliExe"
            }
          }
          $proc = Start-Process -FilePath $selfTestExe -ArgumentList '--self-test-no-load' -WindowStyle Hidden -PassThru
          if (-not $proc.WaitForExit($SelfTestTimeoutSeconds * 1000)) {
            try {
              $proc.Kill($true)
            } catch {
              $proc.Kill()
            }
            $logText = ""
            if (Test-Path $logs) {
              $latestTimeoutLog = Get-ChildItem -LiteralPath $logs -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1 -ExpandProperty FullName
              if ($latestTimeoutLog) {
                $logText = Get-Content -LiteralPath $latestTimeoutLog -Raw
              }
            }
            throw "Portable self-test timed out after ${SelfTestTimeoutSeconds}s.`n$logText"
          }
          if (-not (Test-Path $logs)) {
            throw "Portable self-test did not produce runtime logs. ExitCode=$($proc.ExitCode)"
          }
          $latestLog = Get-ChildItem -LiteralPath $logs -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $latestLog) {
            throw "Portable self-test did not produce a log file. ExitCode=$($proc.ExitCode)"
          }
          $logText = Get-Content -LiteralPath $latestLog -Raw
          if ($logText -notmatch '便携包自检通过') {
            throw "Portable self-test failed. ExitCode=$($proc.ExitCode)`n$logText"
          }
          $mirosDir = Join-Path $appSmokeDir '_internal\external\ai4m-miros'
          $statusJson = Join-Path $env:RUNNER_TEMP 'miros-worker-missing-input-smoke.json'
          $probeMidi = Join-Path $env:RUNNER_TEMP 'miros-worker-missing-input-smoke.mid'
          $MirosWorkerTimeoutSeconds = 120
          Remove-Item -LiteralPath $statusJson, $probeMidi -ErrorAction SilentlyContinue
          Push-Location $mirosDir
          try {
            $args = @(
              '--miros-worker',
              '-i', (Join-Path $env:RUNNER_TEMP 'missing-miros-probe.wav'),
              '-o', $probeMidi,
              '--status-json', $statusJson
            )
            $worker = Start-Process -FilePath (Join-Path $appSmokeDir 'MusicToMidi.exe') -ArgumentList $args -WindowStyle Hidden -PassThru
            if (-not $worker.WaitForExit($MirosWorkerTimeoutSeconds * 1000)) {
              try {
                $worker.Kill($true)
              } catch {
                $worker.Kill()
              }
              $statusText = if (Test-Path $statusJson) { Get-Content -LiteralPath $statusJson -Raw } else { "" }
              throw "MIROS worker missing-input smoke timed out after ${MirosWorkerTimeoutSeconds}s.`n$statusText"
            }
          } finally {
            Pop-Location
          }
          if (-not (Test-Path $statusJson)) {
            throw "MIROS worker missing-input smoke did not write a status file. ExitCode=$($worker.ExitCode)"
          }
          $mirosStatus = Get-Content -LiteralPath $statusJson -Raw
          if ($mirosStatus -notmatch '"ok": false') {
            throw "MIROS worker missing-input smoke returned an unexpected status:`n$mirosStatus"
          }
          if ($mirosStatus -notmatch 'MIROS input audio does not exist') {
            throw "MIROS worker missing-input smoke failed before the expected missing-input check:`n$mirosStatus"
          }
          $frontendExe = Join-Path $frontendSmokeDir 'MusicToMidiFrontend.exe'
          if (-not (Test-Path -LiteralPath $frontendExe -PathType Leaf)) {
            throw "Portable smoke package is missing the standalone Web frontend executable"
          }
          $backendConfig = Join-Path $env:RUNNER_TEMP 'music-to-midi-backend-smoke.json'
          $frontendConfig = Join-Path $env:RUNNER_TEMP 'music-to-midi-frontend-smoke.json'
          @{
            host = '127.0.0.1'
            port = 18765
            data_dir = (Join-Path $env:RUNNER_TEMP 'music-to-midi-web-jobs')
            allowed_origins = @('http://127.0.0.1:15173')
            log_level = 'info'
            retention_days = 1
            retention_max_jobs = 10
          } | ConvertTo-Json | Set-Content -LiteralPath $backendConfig -Encoding UTF8
          @{
            host = '127.0.0.1'
            port = 15173
            public_host = '127.0.0.1'
            backend_url = 'http://127.0.0.1:18765'
            open_app_window = $false
            edge_path = ''
          } | ConvertTo-Json | Set-Content -LiteralPath $frontendConfig -Encoding UTF8
          $backendProcess = $null
          $frontendProcess = $null
          try {
            $backendProcess = Start-Process -FilePath (Join-Path $backendSmokeDir 'MusicToMidiBackend.exe') -ArgumentList @('--config', $backendConfig) -WindowStyle Hidden -PassThru
            $frontendProcess = Start-Process -FilePath $frontendExe -ArgumentList @('--config', $frontendConfig, '--no-window') -WindowStyle Hidden -PassThru
            $health = $null
            $runtimeConfig = $null
            for ($attempt = 1; $attempt -le 60; $attempt++) {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:18765/api/v1/health' -TimeoutSec 2
                $runtimeConfig = Invoke-RestMethod -Uri 'http://127.0.0.1:15173/runtime-config.json' -TimeoutSec 2
                break
              } catch {
                if ($backendProcess.HasExited) {
                  throw "Packaged backend exited during web smoke. ExitCode=$($backendProcess.ExitCode)"
                }
                if ($frontendProcess.HasExited) {
                  throw "Packaged frontend exited during web smoke. ExitCode=$($frontendProcess.ExitCode)"
                }
                if ($attempt -eq 60) {
                  throw "Packaged web services did not become healthy within 60 seconds: $($_.Exception.Message)"
                }
                Start-Sleep -Seconds 1
              }
            }
            if ($health.status -ne 'ok' -or $health.api_version -ne '2.0') {
              throw "Packaged backend returned an incompatible health contract: $($health | ConvertTo-Json -Compress)"
            }
            if ($runtimeConfig.expected_api_version -ne '2.0' -or $runtimeConfig.backend_url -ne 'http://127.0.0.1:18765') {
              throw "Packaged frontend returned an incompatible runtime contract: $($runtimeConfig | ConvertTo-Json -Compress)"
            }
            $frontendResponse = Invoke-WebRequest -Uri 'http://127.0.0.1:15173/' -TimeoutSec 5 -UseBasicParsing
            if ($frontendResponse.Headers['Content-Security-Policy'] -notmatch "connect-src 'self' http://127.0.0.1:18765") {
              throw "Packaged frontend CSP does not authorize the configured backend origin"
            }
          } finally {
            foreach ($serviceProcess in @($frontendProcess, $backendProcess)) {
              if ($null -ne $serviceProcess -and -not $serviceProcess.HasExited) {
                Stop-Process -Id $serviceProcess.Id -Force
                $serviceProcess.WaitForExit(10000) | Out-Null
              }
            }
            foreach ($runtimeRoot in $runtimeRoots) {
              if (Test-Path -LiteralPath $runtimeRoot) {
                Remove-Item -LiteralPath $runtimeRoot -Recurse -Force
              }
            }
          }

      - name: 烟测便携产物 (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          APP_SMOKE_DIR="$(pwd)/dist/MusicToMidi-App"
          BACKEND_SMOKE_DIR="$(pwd)/dist/MusicToMidi-WebBackend"
          FRONTEND_SMOKE_DIR="$(pwd)/dist/MusicToMidi-WebFrontend"
          SMOKE_EXE="$APP_SMOKE_DIR/MusicToMidi"
          BACKEND_EXE="$BACKEND_SMOKE_DIR/MusicToMidiBackend"
          FRONTEND_EXE="$FRONTEND_SMOKE_DIR/MusicToMidiFrontend"
          APP_CLI_EXE="$APP_SMOKE_DIR/MusicToMidiCLI"
          BACKEND_CLI_EXE="$BACKEND_SMOKE_DIR/MusicToMidiCLI"
          RUNTIME_ROOTS=(
            "$APP_SMOKE_DIR/runtime"
            "$BACKEND_SMOKE_DIR/runtime"
            "$FRONTEND_SMOKE_DIR/runtime"
          )
          export QT_QPA_PLATFORM=offscreen
          chmod +x "$SMOKE_EXE" "$BACKEND_EXE" "$FRONTEND_EXE" "$APP_CLI_EXE" "$BACKEND_CLI_EXE"
          for cli_exe in "$APP_CLI_EXE" "$BACKEND_CLI_EXE"; do
            CLI_ROUTES_JSON="$($cli_exe routes --json)"
            python - "$CLI_ROUTES_JSON" <<'PY'
          import json
          import sys

          payload = json.loads(sys.argv[1])
          if payload.get("count") != 13 or len(payload.get("routes", [])) != 13:
              raise SystemExit(f"packaged native CLI route contract mismatch: {payload!r}")
          PY
          done
          PACKAGE_TEST_TIMEOUT_SECONDS=120
          PACKAGE_TEST_OUTPUT="${RUNNER_TEMP:-/tmp}/music-to-midi-package-test-output.log"
          SELF_TEST_TIMEOUT_SECONDS=900
          SELF_TEST_OUTPUT="${RUNNER_TEMP:-/tmp}/music-to-midi-self-test-output.log"
          MIROS_WORKER_TIMEOUT_SECONDS=120
          MIROS_WORKER_OUTPUT="${RUNNER_TEMP:-/tmp}/music-to-midi-miros-worker-output.log"
          dump_linux_portable_logs() {
            if [ -f "$PACKAGE_TEST_OUTPUT" ]; then
              echo "=== Portable package self-test output: $PACKAGE_TEST_OUTPUT ===" >&2
              tail -n 200 "$PACKAGE_TEST_OUTPUT" >&2 || true
            fi
            if [ -f "$SELF_TEST_OUTPUT" ]; then
              echo "=== Portable self-test output: $SELF_TEST_OUTPUT ===" >&2
              tail -n 200 "$SELF_TEST_OUTPUT" >&2 || true
            fi
            local runtime_root
            local log_dir
            for runtime_root in "${RUNTIME_ROOTS[@]}"; do
              log_dir="$runtime_root/logs"
              if [ -d "$log_dir" ]; then
                echo "=== Portable runtime logs: $log_dir ===" >&2
                find "$log_dir" -maxdepth 1 -type f -print -exec tail -n 200 {} \; >&2 || true
              else
                echo "No portable runtime log directory found: $log_dir" >&2
              fi
            done
          }
          dump_miros_worker_logs() {
            if [ -f "$MIROS_WORKER_OUTPUT" ]; then
              echo "=== MIROS worker output: $MIROS_WORKER_OUTPUT ===" >&2
              tail -n 200 "$MIROS_WORKER_OUTPUT" >&2 || true
            fi
            if [ -f "$STATUS_JSON" ]; then
              echo "=== MIROS worker status: $STATUS_JSON ===" >&2
              cat "$STATUS_JSON" >&2 || true
            fi
          }
          set +e
          MUSIC_TO_MIDI_ACCELERATOR=cuda \
            timeout --signal=TERM --kill-after=30s "${PACKAGE_TEST_TIMEOUT_SECONDS}s" \
            "$SMOKE_EXE" --self-test-gui-package 2>&1 | tee "$PACKAGE_TEST_OUTPUT"
          PACKAGE_TEST_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$PACKAGE_TEST_EXIT" -eq 124 ] || [ "$PACKAGE_TEST_EXIT" -eq 137 ]; then
            echo "Portable package self-test timed out after ${PACKAGE_TEST_TIMEOUT_SECONDS}s" >&2
            dump_linux_portable_logs
            exit 1
          fi
          if [ "$PACKAGE_TEST_EXIT" -ne 0 ]; then
            echo "Portable package self-test failed. ExitCode=${PACKAGE_TEST_EXIT}" >&2
            dump_linux_portable_logs
            exit "$PACKAGE_TEST_EXIT"
          fi
          set +e
          timeout --signal=TERM --kill-after=30s "${SELF_TEST_TIMEOUT_SECONDS}s" \
            "$SMOKE_EXE" --self-test-no-load 2>&1 | tee "$SELF_TEST_OUTPUT"
          SELF_TEST_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$SELF_TEST_EXIT" -eq 124 ] || [ "$SELF_TEST_EXIT" -eq 137 ]; then
            echo "Portable self-test timed out after ${SELF_TEST_TIMEOUT_SECONDS}s" >&2
            dump_linux_portable_logs
            exit 1
          fi
          if [ "$SELF_TEST_EXIT" -ne 0 ]; then
            echo "Portable self-test failed. ExitCode=${SELF_TEST_EXIT}" >&2
            dump_linux_portable_logs
            exit "$SELF_TEST_EXIT"
          fi
          if ! grep -R "便携包自检通过" "$APP_SMOKE_DIR/runtime/logs" >/dev/null 2>&1; then
            echo "Portable self-test did not write the success marker to runtime logs" >&2
            dump_linux_portable_logs
            exit 1
          fi
          STATUS_JSON="${RUNNER_TEMP:-/tmp}/miros-worker-missing-input-smoke.json"
          PROBE_MIDI="${RUNNER_TEMP:-/tmp}/miros-worker-missing-input-smoke.mid"
          rm -f "$STATUS_JSON" "$PROBE_MIDI"
          pushd "$APP_SMOKE_DIR/_internal/external/ai4m-miros"
          set +e
          timeout --signal=TERM --kill-after=30s "${MIROS_WORKER_TIMEOUT_SECONDS}s" "$SMOKE_EXE" \
            --miros-worker \
            -i "${RUNNER_TEMP:-/tmp}/missing-miros-probe.wav" \
            -o "$PROBE_MIDI" \
            --status-json "$STATUS_JSON" 2>&1 | tee "$MIROS_WORKER_OUTPUT"
          WORKER_EXIT=${PIPESTATUS[0]}
          set -e
          popd
          if [ "$WORKER_EXIT" -eq 124 ] || [ "$WORKER_EXIT" -eq 137 ]; then
            echo "MIROS worker missing-input smoke timed out after ${MIROS_WORKER_TIMEOUT_SECONDS}s" >&2
            dump_miros_worker_logs
            exit 1
          fi
          if [ ! -f "$STATUS_JSON" ]; then
            echo "MIROS worker missing-input smoke did not write a status file. ExitCode=${WORKER_EXIT}" >&2
            dump_miros_worker_logs
            exit 1
          fi
          if ! grep -q '"ok": false' "$STATUS_JSON"; then
            echo "MIROS worker missing-input smoke returned an unexpected status:" >&2
            dump_miros_worker_logs
            exit 1
          fi
          if ! grep -q 'MIROS input audio does not exist' "$STATUS_JSON"; then
            echo "MIROS worker missing-input smoke failed before the expected missing-input check:" >&2
            dump_miros_worker_logs
            exit 1
          fi
          BACKEND_CONFIG="${RUNNER_TEMP:-/tmp}/music-to-midi-backend-smoke.json"
          FRONTEND_CONFIG="${RUNNER_TEMP:-/tmp}/music-to-midi-frontend-smoke.json"
          WEB_JOB_DIR="${RUNNER_TEMP:-/tmp}/music-to-midi-web-jobs"
          BACKEND_OUTPUT="${RUNNER_TEMP:-/tmp}/music-to-midi-backend-smoke.log"
          FRONTEND_OUTPUT="${RUNNER_TEMP:-/tmp}/music-to-midi-frontend-smoke.log"
          rm -rf "$WEB_JOB_DIR"
          rm -f "$BACKEND_CONFIG" "$FRONTEND_CONFIG" "$BACKEND_OUTPUT" "$FRONTEND_OUTPUT"
          cat > "$BACKEND_CONFIG" <<'JSON'
          {
            "host": "127.0.0.1",
            "port": 18765,
            "data_dir": "/tmp/music-to-midi-web-jobs",
            "allowed_origins": ["http://127.0.0.1:15173"],
            "log_level": "info",
            "retention_days": 1,
            "retention_max_jobs": 10
          }
          JSON
          python - "$BACKEND_CONFIG" "$WEB_JOB_DIR" <<'PY'
          import json
          import sys
          from pathlib import Path

          config_path = Path(sys.argv[1])
          payload = json.loads(config_path.read_text(encoding="utf-8"))
          payload["data_dir"] = str(Path(sys.argv[2]).resolve())
          config_path.write_text(json.dumps(payload, ensure_ascii=False), encoding="utf-8")
          PY
          cat > "$FRONTEND_CONFIG" <<'JSON'
          {
            "host": "127.0.0.1",
            "port": 15173,
            "public_host": "127.0.0.1",
            "backend_url": "http://127.0.0.1:18765",
            "open_app_window": false,
            "edge_path": ""
          }
          JSON

          backend_pid=""
          frontend_pid=""
          cleanup_linux_web_smoke() {
            local label
            local pid
            local status
            local label_pid
            for label_pid in "frontend:$frontend_pid" "backend:$backend_pid"; do
              label="${label_pid%%:*}"
              pid="${label_pid#*:}"
              if [ -z "$pid" ]; then
                continue
              fi
              if kill -0 "$pid" 2>/dev/null; then
                echo "Stopping packaged Linux ${label} smoke process: ${pid}"
                kill "$pid"
              fi
              if wait "$pid" 2>/dev/null; then
                echo "Packaged Linux ${label} smoke process exited cleanly"
              else
                status=$?
                echo "Packaged Linux ${label} smoke process exit status after cleanup: ${status}"
              fi
            done
          }
          trap cleanup_linux_web_smoke EXIT
          "$BACKEND_EXE" --config "$BACKEND_CONFIG" >"$BACKEND_OUTPUT" 2>&1 &
          backend_pid=$!
          "$FRONTEND_EXE" --config "$FRONTEND_CONFIG" --no-window >"$FRONTEND_OUTPUT" 2>&1 &
          frontend_pid=$!

          if ! BACKEND_PID="$backend_pid" FRONTEND_PID="$frontend_pid" python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          processes = {
              "backend": int(os.environ["BACKEND_PID"]),
              "frontend": int(os.environ["FRONTEND_PID"]),
          }

          def require_processes_alive() -> None:
              for label, pid in processes.items():
                  try:
                      os.kill(pid, 0)
                  except ProcessLookupError as exc:
                      raise SystemExit(
                          f"Packaged Linux {label} exited during web smoke (pid={pid})"
                      ) from exc

          health = None
          runtime_config = None
          frontend_headers = None
          last_error = None
          for _attempt in range(60):
              require_processes_alive()
              try:
                  with urllib.request.urlopen(
                      "http://127.0.0.1:18765/api/v1/health", timeout=2
                  ) as response:
                      health = json.load(response)
                  with urllib.request.urlopen(
                      "http://127.0.0.1:15173/runtime-config.json", timeout=2
                  ) as response:
                      runtime_config = json.load(response)
                  with urllib.request.urlopen(
                      "http://127.0.0.1:15173/", timeout=2
                  ) as response:
                      response.read(1)
                      frontend_headers = response.headers
                  break
              except (OSError, urllib.error.URLError, json.JSONDecodeError) as exc:
                  last_error = exc
                  time.sleep(1)
          else:
              raise SystemExit(
                  "Packaged Linux web services did not become healthy within 60 seconds: "
                  f"{last_error}"
              )

          if health.get("status") != "ok" or health.get("api_version") != "2.0":
              raise SystemExit(f"Incompatible Linux backend health contract: {health}")
          if (
              runtime_config.get("expected_api_version") != "2.0"
              or runtime_config.get("backend_url") != "http://127.0.0.1:18765"
          ):
              raise SystemExit(
                  f"Incompatible Linux frontend runtime contract: {runtime_config}"
              )
          csp = frontend_headers.get("Content-Security-Policy", "")
          if "connect-src 'self' http://127.0.0.1:18765" not in csp:
              raise SystemExit(f"Linux frontend CSP does not authorize backend: {csp}")
          print("Packaged Linux App, WebBackend, and WebFrontend smoke passed")
          PY
          then
            echo "=== Packaged Linux backend output ===" >&2
            tail -n 200 "$BACKEND_OUTPUT" >&2 || true
            echo "=== Packaged Linux frontend output ===" >&2
            tail -n 200 "$FRONTEND_OUTPUT" >&2 || true
            dump_linux_portable_logs
            exit 1
          fi

          cleanup_linux_web_smoke
          trap - EXIT
          rm -rf "${RUNTIME_ROOTS[@]}" "$WEB_JOB_DIR"

      - name: 创建便携包 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $appName = "MusicToMidi-${{ matrix.platform }}-${{ matrix.variant }}-App"
