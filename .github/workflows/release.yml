          ## Music to MIDI Converter ${TAG}

          ### Highlights

          #### Source BPM, target BPM, and real playback speed
          - Source BPM and project BPM are now independent. Audio and MIDI playback use the real \`project BPM / detected BPM\` ratio, and BPM and speed controls remain synchronized in both directions.
          - Downloaded MIDI files preserve the musical tick grid while replacing placeholder tempo metadata with the current project BPM. Notes, velocities, program changes, pitch bends, SysEx, controllers, and CC64 pedal events are preserved.
          - All seven processing modes now replace fixed 120 BPM backend placeholders consistently. The default **Auto-detect one BPM** mode writes one detected global tempo; **Set one BPM manually** writes only the selected tempo event; **Follow source tempo changes** emits a stable section-level tempo map, prefers bar-aligned changes when meter evidence is reliable, and rejects beat jitter plus half/double-time errors.

          #### MIDI editing, preview, and track workflow
          - The result workspace now includes a full piano-roll editor with selection, add/delete, move, duration/velocity/instrument editing, clipboard operations, undo/redo, reset, and explicit quantization.
          - Edited previews are regenerated in a background worker and verified before they become playable or downloadable. Stale previews are disabled instead of silently falling back to pre-edit audio.
          - The desktop app, Space, and Colab share the same seven modes, 13 explicit per-track transcription routes, split-first WAV workflow, and synchronized transport behavior.
          - Per-track MIDI conversion after separation retains the original mix as the tempo-analysis source instead of inferring whole-song tempo from a sparse isolated stem. Beat-grid failures remain explicit, and complete desktop track errors are selectable and copyable.
          - Qt media teardown and asynchronous preview lifecycle handling were hardened to prevent reset/close races and stale worker results.

          #### Models, installation, and runtime identity
          - MuScriptor Small, Medium, and Large use the identity-checked official v0.3.0 runtime. The default **Official processing path** preserves upstream five-second segment state; the optional **Segment-boundary continuity fix path** only blocks recurrent single-program boundary feedback while preserving genuine tied notes. Both paths run one official inference per segment without retrying, second-pass inference, or post-hoc track rewriting.
          - Source installers verify the active project virtual environment, exact runtime assets, CUDA providers, and required model identities before inference. Missing or mismatched dependencies fail visibly; no backend or CPU fallback is introduced.
          - MuScriptor repositories are gated. Source availability requires an account that has accepted the license on all three Hugging Face model pages and authenticated with \`hf auth login\` or a private \`HF_TOKEN\`; anonymous fully automatic download is not available.
          - PolarFormer now exclusively uses the official \`bs_polarformer_fp16.onnx\` asset. Retired FP32 files and selection paths are rejected.

          #### Portable downloads
          | File | Platform | Inference | Notes |
          |------|----------|-----------|-------|
          | \`MusicToMidi-Windows-GPU-Portable.wim.*\` | Windows | Desktop App + Web inference backend / CUDA 12.8 | Complete package; extracts to separate App, WebBackend, and WebFrontend directories while reusing identical model/runtime files through NTFS hard links |
          | \`MusicToMidi-Windows-WebFrontend-Portable.zip\` | Windows | Web frontend | Standalone folder for another trusted LAN computer; no models, CUDA, or Python included |
          | \`MusicToMidi-Linux-GPU-Portable.tar.gz.part*\` | Linux | Desktop App + Web inference backend / CUDA 12.8 | Complete package with separate App, WebBackend, and WebFrontend directories; shared model/runtime files remain hard-linked after extraction |
          | \`MusicToMidi-Linux-WebFrontend-Portable.tar.gz\` | Linux | Web frontend | Standalone folder for another trusted LAN Linux computer; no models, CUDA, or Python included |
          | \`MusicToMidi-Docker-${TAG}.zip\` / \`.tar.gz\` | Linux containers / NVIDIA CUDA 12.8 | Self-hosted Web + API | Digest-pinned Compose, management scripts, manifests, SBOM, and checksums; selected models are initialized separately |

          The Windows package consists of every \`MusicToMidi-Windows-GPU-Portable.wim.*\` volume, with \`.wim.001\` as the 7-Zip entry point. Extracting to NTFS restores the shared hard links, so App and WebBackend remain visibly separate and independently copyable without storing duplicate model/runtime files on the GPU host. Extracting only one of those directories materializes every file required by that role. Portable GPU roles include the validated model set, MuseScore General SoundFont, FluidSynth, FFmpeg, third-party notices, SBOM, and FFmpeg build audit. Python and a separate CUDA Toolkit are not required; a compatible NVIDIA driver and GPU are part of the runtime requirements.

          Windows publishes one hard-link-preserving WIM for the three separate role directories plus a standalone lightweight WebFrontend ZIP for remote LAN clients. On a LAN client, the complete WebFrontend directory connects to \`MusicToMidiBackend.exe\` on the GPU host through the configured LAN addresses and CORS origin; the backend starts before \`MusicToMidiFrontend.exe\`. This deployment does not include authentication, authorization, or TLS, so its intended environment is a trusted LAN rather than the Internet.

          Linux publishes the same three independently movable roles in one split \`tar.gz\` plus a standalone lightweight WebFrontend archive. GNU tar preserves the App/WebBackend hard links so the shared model/runtime tree is stored once; the release job extracts role probes from the final split archive and verifies the restored hard-link identity before upload. The packaged Linux backend and frontend are also started together and checked for API 2.0, runtime configuration, and CSP parity.

          The Docker asset is a complete self-host distribution rather than a lone image: its Compose file is pinned to the anonymously verified backend and gateway digests, models are selected and initialized explicitly into persistent volumes, and the long-running inference service is offline. It binds to loopback by default and includes Linux/Windows setup, verification, update, and rollback commands in its bundled README.

          The combined portable work is distributed under GPL-3.0 with component-specific notices. Aria-AMT remains CC BY-NC-SA 4.0; MuScriptor checkpoints remain CC BY-NC 4.0 plus their model-page conditions. See \`THIRD_PARTY_NOTICES.md\`, \`THIRD_PARTY_SBOM.txt\`, and \`FFMPEG_BUILD_AUDIT.txt\` inside the package for exact evidence and attribution.
