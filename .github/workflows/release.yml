          }
          Copy-Item -LiteralPath @('LICENSE', 'THIRD_PARTY_NOTICES.md') -Destination "dist/$frontendName" -Force

          $appReadme = @"
          音乐转 MIDI 转换器 Windows 桌面 App（CUDA 12.8）

          MusicToMidi.exe 是桌面 App 入口。完整模型、FluidSynth 和 FFmpeg 已内置；运行环境需要兼容的 NVIDIA GPU 和驱动。
          MusicToMidiCLI.exe 是本地命令行入口；可直接运行 MusicToMidiCLI.exe song.wav，或使用 MusicToMidiCLI.exe batch D:\Audio --recursive -o D:\MidiOutput。
          本目录提供桌面 App 入口及其完整运行环境；WebBackend 与 WebFrontend 位于完整 Windows 包的同级独立目录。
          在 NTFS 上从完整 WIM 包一起解压时，App 与 WebBackend 的相同模型/运行时文件使用硬链接复用物理空间；复制本目录到另一台电脑时会成为完整独立文件，不依赖原电脑上的其他目录。

          处理模式：SMART、VOCAL_SPLIT、SIX_STEM_SPLIT、PIANO_TRANSKUN、PIANO_TRANSKUN_V2_AUG、PIANO_ARIA_AMT、PIANO_BYTEDANCE_PEDAL。
          "@
          $backendReadme = @"
          音乐转 MIDI 转换器 Windows Web 后端（CUDA 12.8）

          MusicToMidiBackend.exe 是处理服务入口。首次运行会在 EXE 旁生成 MusicToMidiBackend.json。
          同目录的 MusicToMidiCLI.exe 可执行本机单文件或目录批处理，并与后端共用同一套模型与推理语义。
          同机默认监听 127.0.0.1:8765；局域网使用时，host 使用服务电脑的实际局域网 IPv4，allowed_origins 使用 Web 前端的实际来源。
          本目录拥有独立后端入口及运行环境；从完整 WIM 包一起解压到 NTFS 时，与桌面 App 相同的模型/运行时文件以硬链接复用。可以把整个 WebBackend 目录单独复制到另一台 GPU 电脑，复制后不依赖 App 目录。
          此包适用于受信任局域网，不内置认证、授权或 TLS，也不具备互联网部署所需的身份保护。
          "@
          $frontendReadme = @"
          音乐转 MIDI 转换器 Windows Web 前端

          Web 启动顺序为：GPU 电脑上的 WebBackend 在前，MusicToMidiFrontend.exe 在后。首次运行会在 EXE 旁生成 MusicToMidiFrontend.json。
          同机默认连接 http://127.0.0.1:8765；局域网使用时把 backend_url 改为后端电脑的实际地址。
          可以把整个 WebFrontend 目录或单独发布的 WebFrontend ZIP 复制到同一局域网的其他 Windows 电脑；该电脑不需要模型、CUDA 或 Python。
          此包是轻量前端，不含模型或推理运行时；Web 处理仍由 WebBackend 提供。
          "@
          Set-Content -LiteralPath "dist/$appName/使用说明.txt" -Value $appReadme -Encoding UTF8
          Set-Content -LiteralPath "dist/$backendName/使用说明.txt" -Value $backendReadme -Encoding UTF8
          Set-Content -LiteralPath "dist/$frontendName/使用说明.txt" -Value $frontendReadme -Encoding UTF8

      - name: 创建便携包 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          SHARED_NAME="MusicToMidi-${{ matrix.platform }}-${{ matrix.variant }}"
