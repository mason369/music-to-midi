      - name: 压缩便携包
        shell: bash
        run: |
          NAME="MusicToMidi-${{ matrix.platform }}-${{ matrix.variant }}"
          SEVENZ_LOW_MEM_ARGS=(-t7z -mx=5 -md=64m -mmt=on)
          echo "压缩前磁盘空间:"
          df -h .

          # PyInstaller 构建完成后，build/ 中的中间产物和 staged model assets
          # 已经复制进 dist/${NAME}，压缩前清掉它们以降低 runner 磁盘峰值。
          rm -rf build
          rm -rf "$HOME/.cache/pip" "$HOME/.cache/torch" "$HOME/.cache/music_ai_models" "$HOME/.music-to-midi"
          echo "清理构建缓存后磁盘空间:"
          df -h .

          if [ "${{ matrix.platform }}" = "Windows" ]; then
            # 先检查未压缩目录大小，避免对大包做无意义的多轮压缩
            DIR_SIZE=$(du -sb "dist/${NAME}" | cut -f1)
            echo "未压缩目录大小: $(( DIR_SIZE / 1048576 )) MB"
            if [ "$DIR_SIZE" -gt 3000000000 ]; then
              # >3GB 目录直接用分卷 7z（跳过 zip 和单文件 7z）
              echo "目录较大，直接使用分卷 7z 压缩..."
              cd dist && 7z a "${SEVENZ_LOW_MEM_ARGS[@]}" -v1900m "../${NAME}-Portable.7z" "${NAME}" && cd ..
            else
              # 小包先试 zip
              cd dist && 7z a -tzip "../${NAME}-Portable.zip" "${NAME}" && cd ..
              FILE_SIZE=$(stat -c%s "${NAME}-Portable.zip" 2>/dev/null || wc -c < "${NAME}-Portable.zip" | tr -d ' ')
              if [ "$FILE_SIZE" -gt 1900000000 ]; then
                rm "${NAME}-Portable.zip"
                cd dist && 7z a "${SEVENZ_LOW_MEM_ARGS[@]}" "../${NAME}-Portable.7z" "${NAME}" && cd ..
                SEVENZ_SIZE=$(stat -c%s "${NAME}-Portable.7z" 2>/dev/null || wc -c < "${NAME}-Portable.7z" | tr -d ' ')
                if [ "$SEVENZ_SIZE" -gt 1900000000 ]; then
                  rm "${NAME}-Portable.7z"
                  cd dist && 7z a "${SEVENZ_LOW_MEM_ARGS[@]}" -v1900m "../${NAME}-Portable.7z" "${NAME}" && cd ..
                fi
              fi
            fi

            echo "校验 Windows 压缩包..."
            for archive in "${NAME}-Portable.zip" "${NAME}-Portable.7z" "${NAME}-Portable.7z.001"; do
              if [ -f "$archive" ]; then
                7z t "$archive"
              fi
            done
          else
            # Linux GPU 包较大，直接流式写入分卷，避免先生成一个完整 tar.gz
            # 再 split 造成额外磁盘峰值。
            tar -czf - -C dist "${NAME}" | split -b 1900M - "${NAME}-Portable.tar.gz.part"
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: MusicToMidi-${{ matrix.platform }}-${{ matrix.variant }}
          path: MusicToMidi-${{ matrix.platform }}-${{ matrix.variant }}-Portable*

  release:
    name: 上传到 GitHub Release
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: 检出发布源码
        uses: actions/checkout@v6

      - name: 下载所有构建产物
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: 列出构建产物
        run: ls -lh MusicToMidi-*

      - name: 确定目标标签
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            LATEST=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName -q '.[0].tagName')
            echo "tag=${LATEST}" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 校验 pyproject、运行时版本与发布标签一致
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python - <<'PY'
          import ast
          import os
          import tomllib
          from pathlib import Path

          project_version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          module = ast.parse(Path("src/__init__.py").read_text(encoding="utf-8"))
          runtime_version = next(
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
          )
          release_tag = os.environ["RELEASE_TAG"].strip()
          expected_tag = f"v{project_version}"
          if runtime_version != project_version:
              raise SystemExit(
                  f"Version mismatch: pyproject.toml={project_version}, src.__version__={runtime_version}"
              )
          if release_tag != expected_tag:
              raise SystemExit(
                  f"Release tag mismatch: expected {expected_tag} from project version, got {release_tag!r}"
              )
          print(f"Version contract verified: {release_tag}")
          PY

      - name: 创建 Release（如不存在）
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if ! gh release view "${TAG}" --repo ${{ github.repository }} &>/dev/null; then
            gh release create "${TAG}" \
              --repo ${{ github.repository }} \
              --title "${TAG}" \
              --notes "正在准备发布说明..."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 更新 Release 说明
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          cat > release-notes.md << NOTES
          ## 音乐转MIDI转换器 ${TAG}

          ### ${TAG} 主要更新

          #### 原曲 BPM、目标 BPM 与真实播放速度
          - 原曲 BPM 与目标 BPM 现在是两个独立状态：即使设置了自定义目标 BPM，应用仍会先自动识别原曲速度，并以“目标 BPM ÷ 原曲 BPM”同步控制原音与 MIDI 的实际播放倍率。
          - BPM 与速度控件双向联动。调整 BPM 会立即换算速度，调整速度也会反算 BPM；播放过程中修改同样即时生效，不再恢复为后端占位值或错误地保持 1.000x。
          - 下载 MIDI 始终采用结果工作台当前显示的 BPM，并同时更新 tempo 元数据和真实播放时长；采纳 Standard MIDI tempo/tempo map 的 DAW 会与应用内试听保持一致。
          - 下载副本先通过源 tempo map 恢复事件绝对秒，再映射到检测 BPM 的音乐 tick；目标 BPM 阶段保持该 tick 网格和全部消息值/顺序，只替换第 0 轨、第 0 tick 的唯一 tempo 与检测拍号。不吸附节奏网格，也不改变力度、音色、弯音、SysEx 或 CC64 踏板。
          - 修复全部七种模式中后端固定 120 BPM 占位 tempo 的问题，并保留音符、力度、控制器、弯音与 CC64 踏板消息。
          - 自动检测继续使用多引擎共识和拍间隔中位数倍频校正；变速 tempo map 仍为显式可选功能，低置信检测不会伪造速度变化。
          - Mido、PrettyMIDI、FluidSynth、真实 3 分 27 秒 MuScriptor 结果和 Qt 播放链路均已回归。MuseScore 3/4 会对未量化的人类演奏型 MIDI 重新跟拍并可能覆盖乐谱页显示 BPM；这是其 MIDI 导入器行为，本版本不会用破坏音符时间的方式伪装适配。

          #### MIDI 编辑、试听与导出一致性
          - 结果页新增完整钢琴卷帘编辑器：框选和 Ctrl/Shift 多选、添加/删除、拖动、改时值/力度/乐器、剪切复制粘贴、撤销重做、还原，以及用户主动触发的量化操作。
          - 删除、移动或修改音符后会在后台重新生成与当前编辑完全一致的 SoundFont 试听；旧试听在新资产完成前被明确禁用，不再播放编辑前的缓存音频。
          - 导出的编辑 MIDI 会重新构建已编辑音符，同时严格透传源文件中未被编辑器接管的 tempo 之外事件；写后会重新解析并校验 BPM、事件和音符，不把保存成功当成验证成功。
          - 视图缩放与工程速度彻底分离；缩放只改变钢琴卷帘显示宽度。“播放速度”显示工程 BPM ÷ 检测 BPM 的真实倍率，修改 BPM 会同步更新倍率，修改倍率也会反算并写回工程 BPM、试听和导出 MIDI。

          ![工程 BPM 与 MIDI 编辑工作台](https://raw.githubusercontent.com/mason369/music-to-midi/${TAG}/resources/screenshots/05-v1.4-bpm-editor.png)
          *工程 BPM、真实联动速度、钢琴卷帘编辑与下载工作台*

          #### 音轨工作台、播放与稳定性
          - 转写工作台新增可拖动、可点击跳转的播放进度条：拖动实时预览位置，松手或点击即跳转播放；播放中跳转只在释放时提交一次，避免 Windows FFmpeg 媒体后端因高频 seek 卡死。
          - MIDI 作为进度主时钟，原音与乐器分轨统一 seek，并持续校正可感知漂移；调整 BPM/速度后仍保持音频和 MIDI 对齐。
          - 修复 MuScriptor 分片快于计时器分辨率时产生 0 秒耗时样本、进而触发 \`ValueError\` 导致界面闪退的问题。
          - 播放时选择、拖动或批量编辑音符不再在 GUI 线程同步生成音频；编辑预览通过低优先级工作线程生成，并用 generation token 丢弃过期结果，避免旧任务覆盖新编辑。
          - 关闭结果页或再次转换时会停止计时器、取消待处理预览、等待 QThread 完整退出，再释放 Qt Multimedia 对象，修复退出/重置期间的卡死与闪退窗口。
          - 所有转 MIDI 路线统一使用钢琴卷帘与音轨控制；分离模式同时保留真实 WAV 波形和按需生成的 MIDI 音轨，每条音轨独立选择后端并显式开始转换。
          - 人声/伴奏和六声部分离主按钮只生成 WAV，不再暗中自动转写或合并 MIDI；桌面版、Space 与 Colab 的逐轨工作台都提供同一套 13 条显式路线。
          - Space 与 Colab 编辑音符后会通过受信任的结果 token 重新生成唯一试听资产；旧试听和旧下载在刷新完成前明确禁用，失败不会回退到编辑前缓存。
          - 播放头连续插值绘制和稳定的自动居中跟随；支持 \`Ctrl/Alt + 滚轮\` 以鼠标位置为中心缩放、\`Shift + 滚轮\` 横向滚动，手动滚动时退出自动跟随。

          #### MuScriptor Small / Medium / Large：v0.3.0 节拍对齐与长音频高质量推理

          ![MuScriptor vs YourMT3](https://raw.githubusercontent.com/mason369/music-to-midi/${TAG}/docs/MuScriptor_vs_YourMT3.png)
          *保留上一版更新日志中的 MuScriptor Large 与 YourMT3+ 公开评测对比图*

          - 固定源码升级到未修改的上游官方 \`v0.3.0\` commit \`d73147e75e5b9b0c0a79ebe154587db4fd603e0c\`，并对七个运行时源码文件执行 SHA-256 身份校验；项目唯一的 Beat This 网格驱动官方 onset 相位校正、卷帘拍线/强拍/小节底色与 MuseScore 音符轨 tempo，不运行第二套检测。
          - 三档模型均严格使用官方 5 秒窗口、prelude forcing、单次生成路径和默认 \`no_eos_is_ok=True\`，不叠加未合并分支，不私设严格 EOS，不提供静默降档，也不会更换或量化 Small/Medium/Large 权重。
          - 完整混音的 \`SMART\` 模式，以及人声/伴奏、六声部分离后的逐轨转换，均支持 MuScriptor Small / Medium / Large；便携包同时内置并严格校验三套官方权重与配置。
          - 乐器选择支持搜索和真正的多选：留空时由模型自动识别；非空选择会作为生成阶段的硬约束，并在事件流和最终 MIDI 中再次校验，不是只在界面隐藏未选乐器。
          - 支持按 5 秒分片边转写边预览，显示已处理/可播放时间、耗时和预计完成时间；播放范围严格限制在已经生成的 MIDI。Small/Medium 为显存或速度受限设备提供更实用的选择，Large 保留最高容量。
          - 内置 MuseScore General SoundFont 与 FluidSynth，提供真实 MIDI 试听、原音/MIDI 混合、立体声、逐乐器静音/独奏，以及 MIDI、合成 WAV 和立体声结果下载。

          #### 平台、文档与发布
          - 桌面版、Hugging Face Space 和 Colab 同步七种处理模式、MuScriptor 乐器约束、逐轨转换入口和中英文文案。
          - PolarFormer 固定使用官方 \`bs_polarformer_fp16.onnx\`；已移除并拒绝退役 FP32 文件，不再存在 PolarFormer FP32 推理选择路径。其他模型仍各自遵循官方 FP32、FP16/BF16 或 autocast 策略，不做全局精度强改。
          - README、MuScriptor 专题文档和 Hugging Face 模型说明已补充公开分数、适用边界、Mirelo Studio 私有增强版区别及后续模型观察项。
          - 源码安装会在下载大体积资源前检查 MuScriptor 三档 gated 仓库权限；首次使用者必须先在三个模型页接受许可，并通过 \`hf auth login\` 或私有 \`HF_TOKEN\` 登录。该限制来自 Hugging Face 与模型许可，不能匿名全自动下载，也不会被静默跳过。
          - Windows/Linux GPU 便携包内置并校验完整模型资产、SoundFont、FluidSynth 与 FFmpeg；依赖或模型身份不匹配时显式失败，不静默切换后端或 CPU。

