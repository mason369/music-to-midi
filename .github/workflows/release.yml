            VOCAL_SPLIT / SIX_STEM_SPLIT 分离阶段不调用 MIDI 后端；完成后可在同一结果工作台逐轨显式选择 13 条 MIDI 路线之一。

          内置资产：YourMT3+ (5 checkpoints)、MIROS (source + pretrained + fine-tuned)、MuScriptor Small / Medium / Large 三套固定权重与配置、
            MuseScore General SoundFont、FluidSynth、SW Fixed、Leap XE、Leap Instrumental、TransKun 2.0.1 default V2、
            TransKun V2 Aug、Aria-AMT 与 ByteDance Pedal。

          无需安装 Python，解压即用
          HEREDOC

          cat > "dist/${BACKEND_NAME}/使用说明.txt" <<'HEREDOC'
          音乐转 MIDI 转换器 Linux Web 后端（CUDA 12.8）

          ./MusicToMidiBackend 是独立处理服务入口。首次运行会在可写运行目录生成配置；局域网地址由 host、端口和 allowed_origins 配置决定。
