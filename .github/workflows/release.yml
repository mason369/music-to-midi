          cat > "dist/${APP_NAME}/使用说明.txt" <<'HEREDOC'
          音乐转 MIDI 转换器 Linux 桌面 App（CUDA 12.8）

          使用方法：
            运行 ./MusicToMidi 即可启动。完整模型、FluidSynth 和 FFmpeg 已内置，无需安装 Python 或 CUDA Toolkit。
